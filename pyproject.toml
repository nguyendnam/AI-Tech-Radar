[tool.ruff]
target-version = "py312"
exclude = [".venv", ".test-env", "node_modules"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"scripts/test_connections.py" = ["E402"]
