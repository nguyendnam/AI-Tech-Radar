name: Check AI Tech Radar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src scripts tests collect.py digest.py cleanup.py
      - run: ruff format --check src scripts tests collect.py digest.py cleanup.py
      - run: python -m unittest discover -s tests -v
      - run: node --test scheduler/src/index.test.js
